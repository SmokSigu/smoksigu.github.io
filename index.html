<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SmokSigu | Infernal Altar</title>
    <style>
        :root {
            --main-red: #ff0000;
            --dark-bg: #000000;
            --stone-texture: url('https://www.transparenttextures.com/patterns/dark-dotted-2.png');
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--dark-bg);
            background-image: var(--stone-texture);
            color: var(--main-red);
            font-family: 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
            position: relative;
        }

        .fire-bg {
            position: absolute;
            bottom: -20px; left: 0; width: 100%; height: 50vh;
            background: linear-gradient(0deg, rgba(255,60,0,0.4) 0%, rgba(255,0,0,0.15) 50%, rgba(0,0,0,0) 100%);
            filter: blur(40px);
            opacity: 0.2;
            z-index: -1;
            animation: firePulse 6s infinite alternate;
        }

        .runes-circle {
            position: absolute;
            top: 50%; left: 50%;
            width: 700px; height: 700px;
            transform: translate(-50%, -50%);
            z-index: 1;
            animation: rotateRunes 100s linear infinite;
            pointer-events: none;
        }

        @media (max-width: 600px) {
            .runes-circle { width: 450px; height: 450px; }
            h1 { font-size: 1.8rem !important; }
            .btn { padding: 15px !important; font-size: 1rem !important; }
        }

        .runes-text {
            font-size: 18px;
            color: var(--main-red);
            opacity: 0.12;
            filter: drop-shadow(0 0 8px var(--main-red));
        }

        body::after {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(0,0,0,0) 0%, rgba(0,0,0,0.95) 100%);
            z-index: 5;
            pointer-events: none;
        }

        .screen {
            display: none;
            flex-direction: column;
            gap: 15px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            animation: fadeIn 0.4s ease-out;
            position: relative;
            z-index: 10;
        }

        .screen.active { display: flex; }

        h1 {
            font-size: 2.2rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 20px;
            text-shadow: 0 0 15px var(--main-red);
        }

        .btn {
            padding: 20px;
            border: 2px solid var(--main-red);
            color: var(--main-red);
            background: rgba(0,0,0,0.7);
            text-transform: uppercase;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.3s;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn:active { transform: scale(0.95); background: var(--main-red); color: #000; }
        
        @media (min-width: 1024px) {
            .btn:hover { background: var(--main-red); color: #000; box-shadow: 0 0 40px var(--main-red); transform: scale(1.02); }
        }

        .qr-box {
            background: white; padding: 12px; border-radius: 8px;
            margin: 5px auto; width: 180px; height: 180px;
        }
        .qr-box img { width: 100%; height: 100%; }

        .addr-display {
            background: #111; border: 1px dashed #444; padding: 12px;
            font-family: monospace; font-size: 0.85rem; word-break: break-all;
            margin-top: 10px; cursor: pointer;
            color: #fff;
        }

        .input-altar {
            width: 100%; background: #000; border: 1px solid var(--main-red);
            color: #fff; padding: 12px; margin-top: 10px; font-family: inherit;
        }

        .back-link { margin-top: 30px; font-size: 0.8rem; color: #555; text-transform: uppercase; cursor: pointer; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes firePulse { from { opacity: 0.15; } to { opacity: 0.3; } }
        @keyframes rotateRunes { from { transform: translate(-50%, -50%) rotate(0deg); } to { transform: translate(-50%, -50%) rotate(360deg); } }
    </style>
</head>
<body>

    <div class="fire-bg"></div>
    <div class="runes-circle" id="runes-target"></div>

    <!-- ГЛАВНЫЙ ЭКРАН -->
    <div id="screen-main" class="screen active">
        <h1>SMOKSIGU ALTAR</h1>
        <a href="https://www.donationalerts.com/r/smoksigu" target="_blank" class="btn">💀 DonationAlerts</a>
        <div class="btn" onclick="showScreen('screen-crypto')">💎 Crypto Donation</div>
        <div class="btn" onclick="showScreen('screen-card')">💳 UAH CARD</div>
    </div>

    <!-- ЭКРАН КАРТЫ -->
    <div id="screen-card" class="screen">
        <h1>DIRECT CARD</h1>
        <div class="addr-display" id="card-text" onclick="copyCard()">4874 0700 6012 5406</div>
        <div style="font-size: 0.7rem; color: #666; margin-top: 5px;">НАЖМИ ЧТОБЫ СКОПИРОВАТЬ</div>
        
        <div style="margin-top: 20px;">
            <input type="text" id="nick-card" class="input-altar" placeholder="ТВОЙ НИК">
            <textarea id="msg-card" class="input-altar" rows="2" placeholder="Сообщение стримеру"></textarea>
            <button class="btn" style="width: 100%; margin-top: 10px;" onclick="sendDonation('card')">ОТПРАВИТЬ ДОНАТ</button>
        </div>
        <div class="back-link" onclick="showScreen('screen-main')"><- НАЗАД</div>
    </div>

    <!-- ЭКРАН ВЫБОРА КРИПТЫ -->
    <div id="screen-crypto" class="screen">
        <h1>SELECT COIN</h1>
        <div class="btn" onclick="showQR('USDT (TRC-20)', 'TDu6CEzb17UcRgtXac9A1KK4wtT66kndEB')">💵 USDT (TRC-20)</div>
        <div class="btn" onclick="showQR('TON', 'UQCRFCD3EUhWJTQfIY8gmiqlS57jZCj8NuXuK-6p_ONckpvV')">💎 TON</div>
        <div class="btn" onclick="showQR('TRX', 'TDu6CEzb17UcRgtXac9A1KK4wtT66kndEB')">🔴 TRON (TRX)</div>
        <div class="back-link" onclick="showScreen('screen-main')"><- НАЗАД</div>
    </div>

    <!-- ЭКРАН QR-КОДА -->
    <div id="screen-qr" class="screen">
        <h1 id="coin-title">COIN</h1>
        <div class="qr-box" id="qr-target"></div>
        <div class="addr-display" id="addr-text" onclick="copyToClipboard()">ЗАГРУЗКА...</div>
        
        <div style="margin-top: 15px;">
            <input type="text" id="nick-crypto" class="input-altar" placeholder="ТВОЙ НИК">
            <textarea id="msg-crypto" class="input-altar" rows="2" placeholder="Сообщение стримеру"></textarea>
            <button class="btn" style="width: 100%; margin-top: 10px;" onclick="sendDonation('crypto')">ОТПРАВИТЬ ДОНАТ</button>
        </div>
        <div class="back-link" onclick="showScreen('screen-crypto')"><- К МОНЕТАМ</div>
    </div>

    <script>
        // Генерация рунического круга
        const runes = "ᚠᚢᚦᚨᚱᚲᚷᚹᚺᚻᚾᛁᛃᛇᛈᛉᛊᛋᛏᛒᛖᛗᛚᛜᛝᛟᛞ";
        const target = document.getElementById('runes-target');
        const radius = window.innerWidth < 600 ? 210 : 340;
        const count = window.innerWidth < 600 ? 25 : 45;

        for (let i = 0; i < count; i++) {
            const r = document.createElement('div');
            r.className = 'runes-text';
            r.innerText = runes[i % runes.length];
            r.style.position = 'absolute';
            const angle = (i / count) * Math.PI * 2;
            r.style.left = (Math.sin(angle) * radius + radius) + 'px';
            r.style.top = (-Math.cos(angle) * radius + radius) + 'px';
            r.style.transform = `rotate(${angle * 180 / Math.PI}deg)`;
            target.appendChild(r);
        }

        // Логика переключения экранов
        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        // Показ QR-кода
        function showQR(name, addr) {
            document.getElementById('coin-title').innerText = name;
            document.getElementById('addr-text').innerText = addr;
            const url = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(addr)}`;
            document.getElementById('qr-target').innerHTML = `<img src="${url}" alt="QR">`;
            showScreen('screen-qr');
        }

        // Копирование крипто-адреса
        function copyToClipboard() {
            const txt = document.getElementById('addr-text');
            navigator.clipboard.writeText(txt.innerText);
            const old = txt.innerText;
            txt.innerText = "СКОПИРОВАНО!";
            setTimeout(() => { txt.innerText = old; }, 1000);
        }

        // Копирование карты
        function copyCard() {
            const txt = document.getElementById('card-text');
            navigator.clipboard.writeText("4874070060125406");
            const old = txt.innerText;
            txt.innerText = "СКОПИРОВАНО!";
            setTimeout(() => { txt.innerText = old; }, 1000);
        }

        // ОТПРАВКА В ТЕЛЕГРАМ
        function sendDonation(type) {
            const nick = document.getElementById(`nick-${type}`).value;
            const msg = document.getElementById(`msg-${type}`).value;

            if(!nick || !msg) return alert('ЗАПОЛНИ ПОЛЯ, ГРЕШНИК!');

            const token = '8843044750:AAE2oDK0n5ZQZ4n8Zmyv2jtl4aBp0Z_r3_Q';
            const chatId = '8354197397';
            
            const text = `💀 ДОНАТ (${type.toUpperCase()})\n👤 От: ${nick}\n💬 Сообщение стримеру: ${msg}`;

            fetch(`https://api.telegram.org/bot${token}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent(text)}`)
            .then(response => {
                if(response.ok) {
                    alert('ДОНАТ УШЕЛ В БЕЗДНУ!');
                    document.getElementById(`nick-${type}`).value = '';
                    document.getElementById(`msg-${type}`).value = '';
                } else {
                    alert('ОШИБКА: Убедись, что бот запущен (/start в ТГ)');
                }
            })
            .catch(() => alert('Связь с бездной прервана (Ошибка сети)'));
        }
    </script>
</body>
</html>
